[package]
name = "kreepto"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
# catch_unwind in the FFI boundary (see run_guarded in lib.rs) can only
# contain a panic when the unwind strategy is used; `abort` would defeat it.
panic = "unwind"
strip = "symbols"
debug = false

[dependencies]
argon2 = "0.4"
aes = "0.9"
chacha20 = "0.9"
salsa20 = "0.9"
